name: Build Postly Windows Installer

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "electron/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Postly installer
        uses: actions/upload-artifact@v4
        with:
          name: Postly-Windows-Installer
          path: dist/Postly-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
