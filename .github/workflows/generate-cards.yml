name: Generate daily cards
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/generate-cards.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install pillow
      - run: python generate_cards.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scheduled/2026-09-15
          git commit -m "Generate 2026-09-15 Instagram cards"
          git push
