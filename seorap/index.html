function request(store,method,value){return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');const req=method==='getAll'?tx.objectStore(store).getAll():method==='get'?tx.objectStore(store).get(value):method==='delete'?tx.objectStore(store).delete(value):method==='clear'?tx.objectStore(store).clear():tx.objectStore(store).put(value);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('seorap-archive-local',1);req.onupgradeneeded=()=>{const d=req.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('folders',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'key'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function load(){S.items=await request('items','getAll');S.folders=await request('folders','getAll');S.items.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));const b=await request('meta','get','backupAt');S.lastBackup=b?.value||null}
async function saveItem(item,quiet=false){item.updatedAt=now();try{await request('items','put',item);const i=S.items.findIndex(x=>x.id===item.id);if(i<0)S.items.unshift(item);else S.items[i]=item;if(!quiet)toast('저장했어요')}catch(e){console.error(e);toast('저장 실패 — 브라우저 저장공간을 확인해 주세요',true);throw e}}
async function removeItem(item){await request('items','delete',item.id);S.items=S.items.filter(x=>x.id!==item.id);const obj=S.cache.get(item.id);if(obj){URL.revokeObjectURL(obj);S.cache.delete(item.id)}}
async function saveFolder(f){await request('folders','put',f);const i=S.folders.findIndex(x=>x.id===f.id);if(i>=0)S.folders[i]=f;else S.folders.push(f)}
async function photoUrl(item){if(S.cache.has(item.id))return S.cache.get(item.id);if(!(item.blob instanceof Blob))return '';const u=URL.createObjectURL(item.blob);S.cache.set(item.id,u);return u}
function isAlive(x){return !x.trashed};function visibleItems(){let a=S.items.filter(isAlive);if(S.view==='docs')a=a.filter(x=>x.type==='doc');if(S.view==='photos')a=a.filter(x=>x.type==='photo');if(S.view==='links')a=a.filter(x=>x.type==='link');if(S.view==='favs')a=a.filter(x=>x.favorite);if(S.view==='trash')a=S.items.filter(x=>x.trashed);if(S.view==='folder')a=a.filter(x=>x.folderId===S.folderId);if(S.view==='search'||S.query.trim()){const q=S.query.toLocaleLowerCase();a=a.filter(x=>[x.title,x.content?.replace(/<[^>]*>/g,' '),x.notes,x.description,x.url,x.tags?.join(' ')].some(y=>String(y||'').toLocaleLowerCase().includes(q)))}return [...a].sort((a,b)=>S.sort==='az'?a.title.localeCompare(b.title,'ko'):(b.updatedAt||'').localeCompare(a.updatedAt||''))}
function folderOptions(current=null){return `<option value="">분류 없음</option>`+S.folders.map(f=>`<option value="${esc(f.id)}" ${f.id===current?'selected':''}>${esc(folderLabel(f))}</option>`).join('')}
function folderLabel(f){const names=[f.name];let p=f.parentId,n=0;while(p&&n++<10){const x=S.folders.find(y=>y.id===p);if(!x)break;names.unshift(x.name);p=x.parentId}return names.join(' / ')}
const views={home:['홈','대시보드'],docs:['전체 문서','문서'],photos:['사진 보관함','이미지'],links:['링크 보관함','북마크'],favs:['즐겨찾기','즐겨찾기'],trash:['휴지통','휴지통'],settings:['설정 · 백업','설정'],search:['전체 검색','검색'],folder:['폴더','폴더']};
function navButton(v,title,ico,count){return `<button class="nav-item ${S.view===v?'active':''}" data-nav="${v}">${icon(ico)}<span>${title}</span>${count!==undefined?`<span class="count">${count}</span>`:''}</button>`}
function folderTree(parent=null,depth=0){return S.folders.filter(f=>(f.parentId||null)===parent).sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(f=>`<div class="folder-item" style="padding-left:${depth*11}px"><button class="nav-item ${S.view==='folder'&&S.folderId===f.id?'active':''}" data-folder="${f.id}" title="${esc(folderLabel(f))}">${icon('folder')}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${esc(f.name)}</span><span class="count">${S.items.filter(x=>!x.trashed&&x.folderId===f.id).length||''}</span></button><button class="more" data-folder-more="${f.id}" aria-label="폴더 설정">${icon('ellipsis')}</button></div>${folderTree(f.id,depth+1)}`).join('')}
function shell(){const alive=S.items.filter(isAlive);return `<div class="mobile-shade ${S.mobile?'show':''}" id="shade"></div><div class="app"><aside class="sidebar ${S.mobile?'open':''}"><div class="brand" data-nav="home"><div class="brand-mark">▤</div><div><div class="brand-name">서랍 <span class="brand-sub">MY ARCHIVE</span></div></div></div><button class="add-primary" id="quick-add">${icon('plus')} 새 자료 추가</button><div class="nav-label">WORKSPACE</div><nav class="nav-list">${navButton('home','홈','home')}${navButton('docs','전체 문서','file',alive.filter(x=>x.type==='doc').length)}${navButton('photos','사진 보관함','image',alive.filter(x=>x.type==='photo').length)}${navButton('links','링크 보관함','link',alive.filter(x=>x.type==='link').length)}${navButton('favs','즐겨찾기','star')}${navButton('trash','휴지통','trash')}</nav><div class="nav-label" style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">FOLDERS<button aria-label="폴더 추가" id="add-folder" class="icon-button" style="width:26px;height:26px">${icon('plus')}</button></div><div class="folder-list">${folderTree()||'<div style="font-size:11px;color:#aab6ad;padding:4px 12px">아직 폴더가 없어요</div>'}</div><div class="side-bottom">${navButton('settings','설정 · 백업','settings')}<div class="storage-note">${icon('shield')} <strong>이 기기에만 저장돼요.</strong><br>다른 기기와 동기화되지 않아요. 정기적으로 백업해 주세요.</div></div></aside><main class="main"><div class="topbar"><button class="icon-button mobile-menu" id="menu-btn" aria-label="메뉴 열기">${icon('menu')}</button><div class="crumb">내 보관함 &nbsp; / &nbsp; <strong>${esc(S.view==='folder'?S.folders.find(f=>f.id===S.folderId)?.name||'폴더':S.view==='doc'?'문서 편집':views[S.view]?.[0]||'홈')}</strong></div><div class="top-actions"><button class="icon-button" data-nav="search" aria-label="검색" title="검색">${icon('search')}</button><button class="small-btn" data-nav="settings">${icon('download')} 백업</button><button class="icon-button" data-nav="settings" aria-label="설정">${icon('settings')}</button></div></div><div class="content" id="page">${page()}</div></main></div>`}
function title(t,desc,actions='',eyebrow='MY ARCHIVE'){return `<div class="page-head"><div><div class="page-eyebrow">${eyebrow}</div><h1 class="page-title">${esc(t)}</h1>${desc?`<p class="page-desc">${desc}</p>`:''}</div><div class="head-actions">${actions}</div></div>`}
function backupNotice(){if(S.lastBackup&&Date.now()-new Date(S.lastBackup).getTime()<7*864e5)return '';if(sessionStorage.getItem('seorap-nudge'))return '';return `<div class="backup-banner">${icon('shield')}<span>자료는 이 브라우저에만 저장돼요. 중요한 글과 사진은 ZIP으로 백업해 주세요.</span><button class="button sm" data-nav="settings">백업하기</button><button class="icon-button" id="dismiss-backup" aria-label="안내 닫기">${icon('close')}</button></div>`}
function home(){const alive=S.items.filter(isAlive);return `${backupNotice()}<div class="hero"><div class="hero-text"><div class="hero-eyebrow">YOUR PERSONAL ARCHIVE</div><h1>생각을 모으는<br>나만의 작은 공간.</h1><p>글, 사진, 영감을 한곳에 차곡차곡 보관하세요.</p><button class="button primary sm" data-create="doc">${icon('plus')} 첫 기록 남기기</button></div><div class="hero-visual">▤</div></div><div class="stat-grid"><div class="stat"><div class="stat-icon">${icon('file')}</div><div><div class="stat-number">${alive.filter(x=>x.type==='doc').length}</div><div class="stat-name">저장한 문서</div></div></div><div class="stat"><div class="stat-icon orange">${icon('image')}</div><div><div class="stat-number">${alive.filter(x=>x.type==='photo').length}</div><div class="stat-name">보관한 사진</div></div></div><div class="stat"><div class="stat-icon blue">${icon('link')}</div><div><div class="stat-number">${alive.filter(x=>x.type==='link').length}</div><div class="stat-name">모아둔 링크</div></div></div></div><div class="section"><div class="section-head"><span class="section-title">빠른 추가</span></div><div class="quick-grid"><button class="quick-card" data-create="doc"><span class="quick-icon">${icon('file')}</span><span><strong>새 문서 작성</strong><small>떠오르는 생각 기록하기</small></span></button><button class="quick-card" data-create="photo"><span class="quick-icon">${icon('image')}</span><span><strong>사진 보관하기</strong><small>영감 이미지 모으기</small></span></button><button class="quick-card" data-create="link"><span class="quick-icon">${icon('link')}</span><span><strong>링크 저장하기</strong><small>다시 보고 싶은 곳 기록하기</small></span></button></div></div><div class="section" style="margin-top:38px"><div class="section-head"><span class="section-title">최근 저장한 자료</span><button class="section-link" data-nav="docs">모두 보기 →</button></div><div class="panel">${alive.length?alive.slice(0,6).map(itemRow).join(''):empty('아직 저장한 자료가 없어요','위에서 첫 번째 기록을 만들어 보세요.','')}</div></div>`}
function itemRow(x){const ty={doc:'file',photo:'image',link:'link'}[x.type];let preview=x.type==='doc'?x.content?.replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').slice(0,80):x.type==='photo'?`${formatBytes(x.size||0)} · ${x.notes||''}`:x.url;return `<div class="row-item clickable" data-open="${x.id}"><div class="row-icon ${x.type}">${icon(ty)}</div><div class="row-main"><div class="row-name">${esc(x.title||'제목 없음')}</div><div class="row-meta">${esc(preview||'내용 없음')} · ${fmt(x.updatedAt)}</div></div>${x.trashed?`<button class="item-action" data-restore="${x.id}" title="복원">${icon('back')}</button><button class="item-action" data-erase="${x.id}" title="영구 삭제">${icon('trash')}</button>`:`<button class="item-action ${x.favorite?'fav-on':''}" data-star="${x.id}" title="즐겨찾기">${icon('star')}</button><button class="item-action" data-more="${x.id}" title="자료 더보기">${icon('ellipsis')}</button>`}</div>`}
function empty(t,desc,action){return `<div class="empty"><div class="empty-icon">✦</div><h3>${esc(t)}</h3><p>${esc(desc)}</p>${action||''}</div>`}
function docsOrFolder(){const data=visibleItems();const name=S.view==='folder'?(S.folders.find(f=>f.id===S.folderId)?.name||'폴더'):views[S.view]?.[0]||'자료';const desc=S.view==='folder'?'이 폴더에 모아둔 자료':S.view==='trash'?'삭제한 자료를 복원하거나 완전히 삭제할 수 있어요':S.view==='favs'?'소중한 자료만 모아보기':'모아둔 기록을 한눈에 살펴보세요';const add=S.view==='trash'?'':`<button class="button primary sm" id="add-items">${icon('plus')} 새 자료</button>`;const filter=S.view==='trash'?'':`<div class="filterbar"><button class="chip ${S.sort==='recent'?'active':''}" data-sort="recent">최근 수정순</button><button class="chip ${S.sort==='az'?'active':''}" data-sort="az">이름순</button><select class="select" id="typefilter" aria-label="종류별 보기"><option value="all">모든 종류</option><option value="doc">문서만</option><option value="photo">사진만</option><option value="link">링크만</option></select></div>`;return title(name,desc,add)+filter+`<div class="panel" id="item-list">${data.length?data.map(itemRow).join(''):empty('저장한 자료가 없어요','새 글이나 링크, 사진을 추가해 보세요.',S.view==='trash'?'':`<button class="button primary sm" id="empty-add">자료 추가하기</button>`)}</div>${S.view==='trash'&&data.length?`<div style="margin-top:15px;text-align:right"><button class="button danger sm" id="empty-trash">휴지통 모두 비우기</button></div>`:''}`}
function photoPage(){const photos=visibleItems().filter(x=>x.type==='photo');return title('사진 보관함','영감이 되는 이미지를 모아서 보고, 원본 그대로 보관하세요.',`<button class="button primary sm" data-create="photo">${icon('upload')} 사진 업로드</button>`,'VISUAL LIBRARY')+`<div class="dropzone" id="photo-drop"><div style="font-size:23px;margin-bottom:5px">▧</div><strong>사진을 이곳에 끌어다 놓으세요</strong><small>또는 위의 사진 업로드 클릭 · JPG, PNG, WEBP, GIF</small></div><div class="gallery">${photos.map(x=>`<button class="photo-card" data-open="${x.id}"><div class="photo-thumb"><img class="lazy-photo" data-photo-id="${x.id}" alt="${esc(x.title)}"></div><div class="photo-caption"><strong>${esc(x.title)}</strong><small>${fmt(x.createdAt)} · ${formatBytes(x.size||0)}</small></div></button>`).join('')}</div>${!photos.length?empty('사진이 아직 없어요','이미지를 올리면 이곳에 모여요',''):''}`}
function linkPage(){const links=visibleItems().filter(x=>x.type==='link');return title('링크 보관함','언제든 다시 찾아보고 싶은 웹사이트와 참고 자료를 모아두세요.',`<button class="button primary sm" data-create="link">${icon('plus')} 링크 추가</button>`,'SAVED REFERENCES')+`<div class="panel">${links.length?links.map(x=>`<div class="link-card"><div class="link-badge">↗</div><div class="row-main"><div class="row-name">${esc(x.title)}</div><div class="row-meta">${esc(x.url)}</div>${x.description?`<div style="font-size:12px;color:#849389;margin-top:4px">${esc(x.description)}</div>`:''}${(x.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><button class="item-action ${x.favorite?'fav-on':''}" data-star="${x.id}" title="즐겨찾기">${icon('star')}</button><button class="item-action" data-open="${x.id}" title="수정">${icon('ellipsis')}</button><a class="icon-button" title="링크 열기" target="_blank" rel="noopener noreferrer" href="${esc(x.url)}">${icon('external')}</a></div>`).join(''):empty('아직 저장한 링크가 없어요','블로그, 영상, 영감 사이트를 저장해 보세요.','')}</div>`}
function searchPage(){return title('전체 검색','글·사진·링크의 제목, 내용, 태그를 함께 검색해요','', 'FIND YOUR IDEAS')+`<div class="searchbar">${icon('search')}<input id="search-input" placeholder="어떤 자료를 찾고 있나요?" value="${esc(S.query)}" autocomplete="off" autofocus><span class="kbd">ESC</span></div><div class="panel" id="search-results">${searchResults()}</div>`}
function searchResults(){if(!S.query.trim())return empty('무엇을 찾으시나요?','검색어를 입력하면 모든 자료에서 찾아드려요.','');const a=visibleItems();return a.length?a.map(itemRow).join(''):empty('일치하는 자료가 없어요','다른 검색어를 입력해 보세요.','')}
function settingsPage(){return title('설정 · 백업','이 보관함의 기록은 현재 사용 중인 브라우저에만 저장돼요.','', 'YOUR DATA, YOUR CONTROL')+`<div class="setting-grid"><div class="setting-card"><div class="page-eyebrow">01 · BACKUP</div><h3 style="margin-top:8px">ZIP으로 전체 백업</h3><p>모든 문서, 폴더, 링크, 원본 사진을 하나의 파일로 내려받아요. 다른 기기로 옮기거나 보관할 때 사용하세요.</p><div class="buttons"><button class="button primary sm" id="export-zip">${icon('download')} ZIP 백업 다운로드</button></div><p>마지막 백업: <strong>${S.lastBackup?fmt(S.lastBackup):'아직 없음'}</strong></p></div><div class="setting-card"><div class="page-eyebrow">02 · RESTORE</div><h3 style="margin-top:8px">백업 파일 복원</h3><p>내보낸 ZIP 파일을 불러와 자료를 복원할 수 있어요. <strong>기존 자료를 전부 교체</strong>하므로 먼저 백업해 두세요.</p><div class="buttons"><button class="button sm" id="import-zip">${icon('upload')} ZIP 파일 불러오기</button></div></div><div class="setting-card"><div class="page-eyebrow">03 · STORAGE</div><h3 style="margin-top:8px">브라우저 저장공간</h3><p id="storage-estimate">기기 저장공간 정보를 확인하는 중...</p><p>사진은 압축하지 않은 원본으로 보관해요. 브라우저가 허용하는 용량을 넘으면 저장이 실패할 수 있어요.</p><div class="buttons"><button class="button sm" id="refresh-storage">${icon('clock')} 사용량 확인</button></div></div><div class="setting-card"><div class="page-eyebrow">04 · IMPORTANT</div><h3 style="margin-top:8px">꼭 알아두세요</h3><p>같은 사이트여도 PC, 휴대폰, 다른 브라우저는 별개 보관함이에요. 시크릿 모드 사용, 사이트 데이터 삭제, 브라우저 프로필 삭제 시 자료가 사라질 수 있어요.</p><div class="warning">자료를 오래 보관하려면 주기적으로 ZIP 백업을 저장하세요.</div></div></div>`}
function editorPage(){const item=S.items.find(x=>x.id===S.docId&&x.type==='doc');if(!item){S.view='docs';return docsOrFolder()}return `<div class="edit-shell"><div class="edit-top"><button class="small-btn" data-nav="docs">${icon('back')} 목록으로</button><span id="save-indicator" style="color:#95a49a;font-size:12px">저장됨</span><div style="display:flex;gap:3px"><button class="icon-button ${item.favorite?'fav-on':''}" data-star="${item.id}" title="즐겨찾기">${icon('star')}</button><button class="icon-button" data-more="${item.id}" title="추가 메뉴">${icon('ellipsis')}</button></div></div><input class="editor-title" id="doc-title" value="${esc(item.title)}" placeholder="제목 없음" aria-label="문서 제목"><div class="editor-meta"><span>생성 ${fmt(item.createdAt)}</span><span>·</span><label>폴더 <select class="select" id="doc-folder">${folderOptions(item.folderId)}</select></label><label>태그 <input id="doc-tags" placeholder="쉼표로 구분" value="${esc((item.tags||[]).join(', '))}"></label></div><div class="toolbar" role="toolbar" aria-label="서식"><button class="tool" data-format="bold" title="굵게"><b>B</b></button><button class="tool" data-format="italic" title="기울임"><i>I</i></button><button class="tool" data-format="underline" title="밑줄"><u>U</u></button><span class="tool sep"></span><button class="tool" data-block="h1">H1</button><button class="tool" data-block="h2">H2</button><button class="tool" data-block="p">본문</button><span class="tool sep"></span><button class="tool" data-format="insertUnorderedList" title="글머리 목록">☷</button><button class="tool" data-format="insertOrderedList" title="번호 목록">1.</button><button class="tool" data-block="blockquote" title="인용">❝</button><span class="tool sep"></span><button class="tool" data-format="insertHorizontalRule" title="구분선">―</button><button class="tool" id="insert-link" title="링크 삽입">${icon('link')}</button><button class="tool" id="insert-photo" title="사진 삽입">${icon('image')}</button><button class="tool" data-format="undo" title="되돌리기">↶</button><button class="tool" data-format="redo" title="다시 실행">↷</button></div><div class="editor-body" contenteditable="true" id="doc-body" role="textbox" aria-multiline="true" aria-label="문서 내용">${sanitize(item.content||'')}</div><div style="margin-top:20px;color:#9eaaa0;font-size:11px">${icon('shield')} 이 문서는 이 기기 브라우저에 자동 저장됩니다.</div></div>`}
function page(){if(S.view==='home')return home();if(S.view==='doc')return editorPage();if(S.view==='photos')return photoPage();if(S.view==='links')return linkPage();if(S.view==='settings')return settingsPage();if(S.view==='search')return searchPage();return docsOrFolder()}

function w16(d,o,n){d.setUint16(o,n,true)}function w32(d,o,n){d.setUint32(o,n>>>0,true)}
async function makeZip(files){let locals=[],centrals=[],offset=0;for(const {name,blob} of files){const nameB=te.encode(name);const bytes=new Uint8Array(await blob.arrayBuffer());const crc=crc32(bytes),loc=new Uint8Array(30+nameB.length),h=new DataView(loc.buffer);w32(h,0,0x04034b50);w16(h,4,20);w16(h,6,0x0800);w16(h,8,0);w32(h,14,crc);w32(h,18,bytes.length);w32(h,22,bytes.length);w16(h,26,nameB.length);loc.set(nameB,30);locals.push(loc,bytes);const cen=new Uint8Array(46+nameB.length),ch=new DataView(cen.buffer);w32(ch,0,0x02014b50);w16(ch,4,20);w16(ch,6,20);w16(ch,8,0x0800);w16(ch,10,0);w32(ch,16,crc);w32(ch,20,bytes.length);w32(ch,24,bytes.length);w16(ch,28,nameB.length);w32(ch,42,offset);cen.set(nameB,46);centrals.push(cen);offset+=loc.length+bytes.length}const cdLen=centrals.reduce((n,a)=>n+a.length,0),end=new Uint8Array(22),ed=new DataView(end.buffer);w32(ed,0,0x06054b50);w16(ed,8,files.length);w16(ed,10,files.length);w32(ed,12,cdLen);w32(ed,16,offset);return new Blob([...locals,...centrals,end],{type:'application/zip'})}
async function readZip(blob){const arr=new Uint8Array(await blob.arrayBuffer());const d=new DataView(arr.buffer);const files=new Map();let off=0;while(off+30<=arr.length&&d.getUint32(off,true)===0x04034b50){const method=d.getUint16(off+8,true),flags=d.getUint16(off+6,true),size=d.getUint32(off+18,true),namelen=d.getUint16(off+26,true),extra=d.getUint16(off+28,true);if(method!==0||(flags&8))throw Error('이 백업 ZIP 형식은 지원하지 않아요');const start=off+30+namelen+extra;if(start+size>arr.length)throw Error('백업 파일이 손상되었어요');const name=td.decode(arr.slice(off+30,off+30+namelen));const body=arr.slice(start,start+size);if(crc32(body)!==d.getUint32(off+14,true))throw Error('백업 파일 검사에 실패했어요');files.set(name,new Blob([body]));off=start+size;if(files.size>100000)throw Error('백업 항목이 너무 많아요')}return files}
async function exportBackup(){const btn=$('#export-zip');if(btn){btn.disabled=true;btn.textContent='ZIP 생성 중...'}try{await flushEditor();const data=S.items.map(({blob,...rest})=>({...rest}));const manifest={format:'seorap-browser-v1',exportedAt:now(),folders:S.folders,items:data};const files=[{name:'archive.json',blob:new Blob([JSON.stringify(manifest)],{type:'application/json'})}];for(const x of S.items)if(x.type==='photo'&&x.blob instanceof Blob)files.push({name:`photos/${x.id}`,blob:x.blob});const zip=await makeZip(files);downloadBlob(zip,`seorap-backup-${new Date().toISOString().slice(0,10)}.zip`);S.lastBackup=now();await request('meta','put',{key:'backupAt',value:S.lastBackup});toast('모든 자료를 ZIP으로 백업했어요');render()}catch(e){console.error(e);toast('ZIP 백업에 실패했어요: '+e.message,true)}finally{if(btn){btn.disabled=false;btn.textContent='ZIP 백업 다운로드'}}}
async function importBackup(file){if(!file)return;try{const files=await readZip(file);const mf=files.get('archive.json');if(!mf)throw Error('서랍 백업 파일이 아니에요');const manifest=JSON.parse(await mf.text());if(manifest.format!=='seorap-browser-v1'||!Array.isArray(manifest.items)||!Array.isArray(manifest.folders))throw Error('지원하지 않는 백업 버전이에요');for(const x of manifest.items){if(!x.id||!['doc','photo','link'].includes(x.type))throw Error('자료 형식이 올바르지 않아요');if(x.type==='photo'&&!files.has(`photos/${x.id}`))throw Error(`사진 원본이 빠졌어요: ${x.title}`)}if(!confirm(`백업 자료 ${manifest.items.length}개, 폴더 ${manifest.folders.length}개를 복원할까요? 현재 저장된 모든 자료가 삭제되고 이 백업으로 대체됩니다.`))return;for(const x of manifest.items){if(x.type==='photo'){const b=files.get(`photos/${x.id}`);x.blob=new Blob([await b.arrayBuffer()],{type:x.mime||'application/octet-stream'})}else if(x.type==='doc')x.content=sanitize(x.content||'')}const tx=db.transaction(['items','folders','meta'],'readwrite');const its=tx.objectStore('items'),fld=tx.objectStore('folders'),met=tx.objectStore('meta');its.clear();fld.clear();for(const f of manifest.folders)fld.put({id:String(f.id),name:String(f.name||'폴더'),parentId:f.parentId||null,createdAt:f.createdAt||now()});for(const x of manifest.items)its.put(x);met.put({key:'backupAt',value:now()});await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});for(const u of S.cache.values())URL.revokeObjectURL(u);S.cache.clear();await load();S.view='home';S.docId=null;S.query='';render();toast('백업을 성공적으로 복원했어요')}catch(e){console.error(e);toast('복원 실패: '+e.message,true)}finally{$('#import-file').value=''}}
async function inlineImage(file){if(!file)return;if(!file.type.startsWith('image/')){toast('이미지 파일만 넣을 수 있어요',true);return}if(file.size>100*1024*1024){toast('사진 크기가 너무 커요 (100MB 이하)',true);return}try{const item={id:id(),type:'photo',title:file.name,filename:file.name,mime:file.type,size:file.size,blob:file,notes:'문서에 삽입한 사진',tags:[],folderId:null,favorite:false,trashed:false,createdAt:now(),updatedAt:now()};await saveItem(item,true);const src=await photoUrl(item);$('#doc-body')?.focus();document.execCommand('insertHTML',false,`<p><img data-asset-id="${item.id}" src="${src}" alt="${esc(item.title)}"></p>`);scheduleSave();toast('문서에 사진을 삽입했어요')}catch(e){toast('사진 삽입에 실패했어요',true)}finally{$('#inline-image').value=''}}
$('#global-files').addEventListener('change',e=>uploadPhotos(e.target.files));$('#inline-image').addEventListener('change',e=>inlineImage(e.target.files[0]));$('#import-file').addEventListener('change',e=>importBackup(e.target.files[0]));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();if(S.view==='search')navigate('home')}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();navigate('search')}});
async function boot(){if(!('indexedDB'in window)){throw Error('이 브라우저는 로컬 저장을 지원하지 않아요')}db=await openDB();await load();if(!S.items.length&&!S.folders.length&&!(await request('meta','get','seeded'))){const starter={id:id(),type:'doc',title:'시작하기 🌿',content:'<h2>어서 오세요, 나만의 서랍에!</h2><p>떠오르는 생각, 소중한 사진, 나중에 읽고 싶은 링크를 저장하는 개인 자료실입니다.</p><ul><li><strong>새 자료 추가</strong> 버튼으로 문서·사진·링크를 저장하세요.</li><li><strong>폴더</strong>를 만들어 주제별로 정리하세요.</li><li>문서는 입력 후 자동으로 저장됩니다.</li><li><strong>설정 · 백업</strong>에서 ZIP 파일로 전체 자료를 백업하세요.</li></ul><blockquote>이 기기 브라우저에만 저장되므로, 다른 기기에서는 자료가 자동으로 보이지 않습니다. 사이트 데이터 삭제에 대비해 백업해 주세요.</blockquote>',folderId:null,tags:['안내'],favorite:true,trashed:false,createdAt:now(),updatedAt:now()};await saveItem(starter,true);await request('meta','put',{key:'seeded',value:true})}render()}
boot().catch(err=>{$('#root').innerHTML=`<div style="max-width:550px;margin:100px auto;padding:25px"><h2>보관함을 열 수 없어요</h2><p>${esc(err?.message||'브라우저 저장소 접근에 실패했어요')}</p><p>시크릿 모드나 저장공간 설정을 확인하고 새로고침해 주세요.</p></div>`;console.error(err)});
})();
