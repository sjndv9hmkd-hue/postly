.auth-art{margin-top:40px;display:flex;align-items:center;gap:12px}.auth-shape{width:60px;height:60px;border-radius:17px;background:#eef0ff;display:grid;place-items:center;font-size:29px}.auth-shape:first-child{background:#4158f6;color:white;transform:rotate(-9deg)}.auth-shape:nth-child(2){background:#ff715b;color:#fff;border-radius:50%;transform:rotate(7deg)}.auth-shape:nth-child(3){background:#eafb93;color:#1a2b21;transform:rotate(11deg)}

.auth-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.auth-pill{background:#eef0ff;color:#4158f6;border:1px solid #e0e5ff;border-radius:60px;font-weight:800;font-size:11px;padding:7px 12px}.auth-lock{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#f6f7fb;color:#4158f6}

.auth-title{font-size:30px;letter-spacing:-1.35px;font-weight:820;margin:0 0 6px}.auth-sub{color:#83899b;margin:0 0 27px;font-size:13px;line-height:1.7}
.auth-field{margin-top:17px}.auth-field label{display:block;font-weight:740;margin:0 0 9px;font-size:12px;color:#373e53}.auth-input-wrap{position:relative}

.auth-input::placeholder{color:#a8adba}.auth-input:focus{border-color:#4158f6;box-shadow:0 0 0 4px #4158f618;outline:none}
.auth-input.password{padding-right:65px}.auth-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-weight:720;font-size:11px;color:#6974aa;padding:9px;border-radius:6px}.auth-eye:hover{background:#eef0ff}
.auth-submit{width:100%;height:53px;background:#4158f6;border-radius:10px;color:white;font-size:14px;font-weight:790;margin-top:24px;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .18s,transform .18s}.auth-submit:hover{background:#3047e8;transform:translateY(-1px)}.auth-submit:disabled{opacity:.55;transform:none}
.auth-error{display:none;margin-top:14px;background:#fff1ef;border:1px solid #ffdbd6;padding:10px 12px;border-radius:8px;color:#c54b3c;font-size:12px;line-height:1.6}.auth-error.show{display:block}
.auth-info{display:flex;gap:8px;align-items:flex-start;margin-top:22px;color:#979daf;font-size:11px;line-height:1.7}.auth-info .ico{width:15px;height:15px;color:#8088a3;margin-top:1px}
.auth-footer{display:flex;justify-content:space-between;gap:12px;margin:0 auto 28px;width:min(1170px,calc(100% - 64px));font-size:11px;letter-spacing:.2px;color:#a0a5b6;position:relative;z-index:1}
.auth-foot-dot{color:#ff715b}.auth-alt{margin-top:14px;border:0;background:none;color:#4158f6;font-size:12px;font-weight:760;text-align:center;width:100%;padding:8px;cursor:pointer}
.logout-button{width:100%;margin-bottom:10px;color:#6973a0;border:1px solid #e6e9f8;border-radius:8px;padding:9px 12px;font-size:12px;display:flex;justify-content:center;align-items:center;gap:8px;background:#fff}.logout-button:hover{background:#eef0ff;color:#4158f6}.top-logout{border:1px solid #e6e9f6;border-radius:8px;padding:8px 10px;color:#727da9;font-size:11px;font-weight:750}.top-logout:hover{background:#eef0ff;color:#4158f6}

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const icon=n=>`<svg class="ico" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>globalThis.crypto?.randomUUID?.()||'x'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const fmt=d=>d?new Date(d).toLocaleDateString('ko-KR',{year:'numeric',month:'short',day:'numeric'}):'';
const formatBytes=b=>b>1024**3?(b/1024**3).toFixed(2)+' GB':b>1024**2?(b/1024**2).toFixed(1)+' MB':(b/1024).toFixed(0)+' KB';
const now=()=>new Date().toISOString();
let db;
const S={items:[],folders:[],view:'home',folderId:null,docId:null,query:'',sort:'recent',mobile:false,cache:new Map(),saveTimer:null,saving:false,loadedDoc:null,lastBackup:null,selection:null,authenticated:false,authRecord:null,authMode:'create',authPending:false,authErrors:0,savedEditorRange:null,insertingImages:false};
function toast(msg,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=msg;$('#toast-root').append(el);setTimeout(()=>el.remove(),3300)}

const AUTH_KEY='local-gate-v1';
// Login persistence only, not encryption. Access is limited to this browser profile/origin.
const REMEMBER_KEY='seorap-remembered-login-v1';
function rememberLogin(record){
 if(!record)return;
 try{localStorage.setItem(REMEMBER_KEY,JSON.stringify({username:record.username,createdAt:record.createdAt,version:1}))}
 catch(e){console.warn('This browser does not allow a persistent login.',e)}
}
function hasRememberedLogin(record){
 if(!record)return false;
 try{
  const saved=JSON.parse(localStorage.getItem(REMEMBER_KEY)||'null');
  return saved?.version===1&&saved.username===record.username&&saved.createdAt===record.createdAt;
 }catch(e){return false}
}
function clearRememberedLogin(){try{localStorage.removeItem(REMEMBER_KEY)}catch(e){console.warn('Could not clear browser login preference.',e)}}
function bytesToBase64(b){return btoa(String.fromCharCode(...new Uint8Array(b)))}
function base64ToBytes(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0))}
async function derivePassword(password,salt,iterations=220000){
 if(!globalThis.crypto?.subtle)throw Error('보안 연결(HTTPS)에서만 비밀번호를 설정할 수 있어요.');
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations},key,256));
}
async function verifyPassword(password,record){const a=await derivePassword(password,base64ToBytes(record.salt),record.iterations);const b=base64ToBytes(record.hash);if(a.length!==b.length)return false;let diff=0;for(let i=0;i<a.length;i++)diff|=a[i]^b[i];return diff===0}
async function persistAuth(username,password){const salt=crypto.getRandomValues(new Uint8Array(16));const iterations=220000;const hash=await derivePassword(password,salt,iterations);const record={key:AUTH_KEY,username,salt:bytesToBase64(salt),hash:bytesToBase64(hash),iterations,version:1,createdAt:now()};await request('meta','put',record);S.authRecord=record}
function authScreen(){const create=S.authMode==='create';return `<div class="auth-screen"><header class="auth-bar"><div class="auth-logo"><span class="auth-mark">s.</span><span>서랍<span style="color:#ff6f55">.</span></span></div><span class="auth-mini">PERSONAL ARCHIVE / PRIVATE SPACE</span></header><main class="auth-main"><div class="auth-grid"><section class="auth-story"><div class="auth-eyebrow">YOUR OWN SPACE</div><h1>모든 영감을,<br><strong>나만의 서랍에.</strong></h1><p>생각과 사진, 다시 보고 싶은 링크까지.<br>나에게 필요한 것만 조용히 모아두는 공간.</p><div class="auth-art" aria-hidden="true"><div class="auth-shape">✦</div><div class="auth-shape">↗</div><div class="auth-shape">●</div></div></section><section class="auth-card" aria-label="보관함 로그인"><div class="auth-card-top"><span class="auth-pill">${create?'처음 시작하기':'PRIVATE LOGIN'}</span><span class="auth-lock">${icon('shield')}</span></div><h1 class="auth-title">${create?'나만의 서랍 만들기':'다시 오셨네요 👋'}</h1><p class="auth-sub">${create?'이 기기에서 사용할 아이디와 비밀번호를 설정하세요.':'내 보관함을 열려면 아이디와 비밀번호를 입력하세요.'}</p><form id="auth-form" autocomplete="off"><div class="auth-field"><label for="auth-username">아이디</label><div class="auth-input-wrap"><input class="auth-input" id="auth-username" name="username" maxlength="30" minlength="2" required autocomplete="username" placeholder="아이디를 입력하세요" value="${create?'':esc(S.authRecord?.username||'')}"></div></div><div class="auth-field"><label for="auth-password">비밀번호</label><div class="auth-input-wrap"><input class="auth-input password" id="auth-password" name="password" type="password" required minlength="${create?8:1}" autocomplete="${create?'new-password':'current-password'}" placeholder="${create?'8자 이상 설정해 주세요':'비밀번호를 입력하세요'}"><button type="button" class="auth-eye" id="auth-eye" aria-label="비밀번호 표시" aria-pressed="false">보기</button></div></div>${create?'<div class="auth-field"><label for="auth-repeat">비밀번호 확인</label><input class="auth-input" id="auth-repeat" name="repeat" type="password" minlength="8" required autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력하세요"></div>':''}<p id="auth-error" class="auth-error" role="alert" aria-live="polite"></p><button type="submit" class="auth-submit" id="auth-submit">${create?'내 서랍 시작하기':'서랍 열기'} <span aria-hidden="true">↗</span></button></form><div class="auth-info">${icon('shield')}<span>${create?'비밀번호를 잊으면 이 브라우저에서 복구할 방법이 없어요. 안전한 곳에 기억해 두세요.':'로그인 후에는 이 브라우저에서 자동 로그인 상태가 유지돼요. 공용 PC라면 사용 후 로그아웃하세요. 자료는 다른 기기와 자동 동기화되지 않아요.'}<br>이 잠금은 기기 내 접근을 제한하며, 저장된 자료 자체를 암호화하지는 않습니다.</span></div></section></div></main><footer class="auth-footer"><span>© SEORAP · MY PERSONAL ARCHIVE</span><span><span class="auth-foot-dot">●</span> STORED LOCALLY ON THIS DEVICE</span></footer></div>`}
function renderAuth(){S.authenticated=false;document.getElementById('modal-root').innerHTML='';$('#root').innerHTML=authScreen();
 $('#auth-eye').onclick=()=>{const el=$('#auth-password');const reveal=el.type==='password';el.type=reveal?'text':'password';$('#auth-eye').textContent=reveal?'숨기기':'보기';$('#auth-eye').setAttribute('aria-pressed',String(reveal))};
 $('#auth-form').onsubmit=submitAuth;
}
function authError(message){const el=$('#auth-error');if(!el)return;el.textContent=message;el.classList.add('show');$('#auth-password')?.focus()}
async function submitAuth(e){e.preventDefault();if(S.authPending)return;
 const username=$('#auth-username').value.trim(),pw=$('#auth-password').value;const creating=S.authMode==='create';
 if(username.length<2||username.length>30)return authError('아이디는 2~30자로 입력해 주세요.');
 if(creating&&(pw.length<8||pw!==$('#auth-repeat').value))return authError(pw.length<8?'비밀번호는 8자 이상이어야 해요.':'비밀번호 확인이 일치하지 않아요.');
 S.authPending=true;const btn=$('#auth-submit');btn.disabled=true;btn.textContent=creating?'계정 만드는 중...':'확인 중...';
 try{
  const existing=await request('meta','get',AUTH_KEY);
  if(creating){if(existing){S.authMode='login';S.authRecord=existing;renderAuth();return authError('이미 이 브라우저에 계정이 있어요. 로그인해 주세요.')}await persistAuth(username,pw)}
  else {if(!existing){S.authMode='create';renderAuth();return authError('이 브라우저에는 아직 계정이 없어요. 새로 만들어 주세요.')}if(existing.username!==username||!(await verifyPassword(pw,existing))){S.authErrors++;return authError('아이디 또는 비밀번호가 일치하지 않아요.')}S.authRecord=existing;S.authErrors=0}
  S.authenticated=true;S.view='home';S.folderId=null;S.docId=null;S.query='';
  rememberLogin(S.authRecord);
  await initializeVault();render();toast(creating?'나만의 서랍이 준비됐어요.':'서랍에 로그인했어요.');
 }catch(err){S.authenticated=false;renderAuth();authError('로그인 중 오류가 발생했어요: '+(err?.message||'다시 시도해 주세요.'))}
 finally{S.authPending=false;if($('#auth-submit')){$('#auth-submit').disabled=false;$('#auth-submit').textContent=creating?'내 서랍 시작하기 ↗':'서랍 열기 ↗'}}
}
async function logout(){clearRememberedLogin();await flushEditor();for(const v of S.cache.values())try{URL.revokeObjectURL(v)}catch(_){}S.cache.clear();S.items=[];S.folders=[];S.lastBackup=null;S.loadedDoc=null;S.authenticated=false;S.authMode='login';S.mobile=false;renderAuth()}
async function initializeVault(){await load();if(!S.items.length&&!S.folders.length&&!(await request('meta','get','seeded'))){const starter={id:id(),type:'doc',title:'시작하기 ✦',content:'<h2>서랍에 오신 걸 환영해요!</h2><p>떠오르는 생각, 소중한 사진, 나중에 읽고 싶은 링크를 저장하는 개인 자료실입니다.</p><ul><li><strong>새로운 기록</strong> 버튼으로 문서·사진·링크를 저장하세요.</li><li><strong>폴더</strong>로 자료를 분류하세요.</li><li>글 사이에 <strong>사진 삽입</strong> 버튼으로 이미지를 넣거나, 사진 파일을 붙여넣거나 드래그해 보세요.</li><li>문서는 자동으로 저장되고 검색에서 제목·본문·태그를 찾을 수 있어요.</li><li><strong>설정 · 백업</strong>에서 ZIP 파일로 전체 자료를 백업하세요.</li></ul><blockquote>이 기기 브라우저에만 저장되므로 다른 기기에서는 자료가 자동으로 나타나지 않습니다. 사이트 데이터 삭제에 대비해 백업해 주세요. 로그인 잠금은 저장 자료를 암호화하지 않습니다.</blockquote>',folderId:null,tags:['안내'],favorite:true,trashed:false,createdAt:now(),updatedAt:now()};await saveItem(starter,true);await request('meta','put',{key:'seeded',value:true})}}
function showChangePassword(){dialog(`<h2>비밀번호 변경</h2><p class="sub">같은 브라우저에서 서랍에 접속할 때 사용할 비밀번호를 변경해요.</p><form id="change-pass-form"><div class="field"><label for="pw-old">현재 비밀번호</label><input type="password" id="pw-old" required autocomplete="current-password"></div><div class="field"><label for="pw-new">새 비밀번호 (8자 이상)</label><input type="password" id="pw-new" required minlength="8" autocomplete="new-password"></div><div class="field"><label for="pw-repeat">새 비밀번호 확인</label><input type="password" id="pw-repeat" required minlength="8" autocomplete="new-password"></div><div class="dialog-actions"><button type="button" class="button sm" data-close>취소</button><button type="submit" class="button primary sm">변경하기</button></div></form>`);bindModal();$('#change-pass-form').onsubmit=async e=>{e.preventDefault();const old=$('#pw-old').value, next=$('#pw-new').value, again=$('#pw-repeat').value;if(next.length<8||next!==again){toast('새 비밀번호를 확인해 주세요',true);return}if(!await verifyPassword(old,S.authRecord)){toast('현재 비밀번호가 틀렸어요',true);return}await persistAuth(S.authRecord.username,next);rememberLogin(S.authRecord);closeDialog();toast('비밀번호가 변경됐어요')}}
function request(store,method,value){return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');const req=method==='getAll'?tx.objectStore(store).getAll():method==='get'?tx.objectStore(store).get(value):method==='delete'?tx.objectStore(store).delete(value):method==='clear'?tx.objectStore(store).clear():tx.objectStore(store).put(value);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('seorap-archive-local',1);req.onupgradeneeded=()=>{const d=req.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('folders',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'key'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function load(){S.items=await request('items','getAll');S.folders=await request('folders','getAll');S.items.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));const b=await request('meta','get','backupAt');S.lastBackup=b?.value||null}
async function saveItem(item,quiet=false){item.updatedAt=now();try{await request('items','put',item);const i=S.items.findIndex(x=>x.id===item.id);if(i<0)S.items.unshift(item);else S.items[i]=item;if(!quiet)toast('저장했어요')}catch(e){console.error(e);toast('저장 실패 — 브라우저 저장공간을 확인해 주세요',true);throw e}}
async function removeItem(item){await request('items','delete',item.id);S.items=S.items.filter(x=>x.id!==item.id);const obj=S.cache.get(item.id);if(obj){URL.revokeObjectURL(obj);S.cache.delete(item.id)}}
async function saveFolder(f){await request('folders','put',f);const i=S.folders.findIndex(x=>x.id===f.id);if(i>=0)S.folders[i]=f;else S.folders.push(f)}
async function photoUrl(item){if(S.cache.has(item.id))return S.cache.get(item.id);if(!(item.blob instanceof Blob))return '';const u=URL.createObjectURL(item.blob);S.cache.set(item.id,u);return u}
function isAlive(x){return !x.trashed}
function plainDoc(x){return String(x?.content||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;|&#160;/g,' ').replace(/\s+/g,' ').trim()}
function searchText(x){const folder=S.folders.find(f=>f.id===x.folderId);return [x.title,plainDoc(x),x.notes,x.description,x.url,(x.tags||[]).join(' '),folder?.name||''].join(' ').toLocaleLowerCase('ko')}
function searchMatch(x,query){const words=String(query||'').trim().toLocaleLowerCase('ko').split(/\s+/).filter(Boolean);return words.every(w=>searchText(x).includes(w))}
function visibleItems(){let a=S.items.filter(isAlive);if(S.view==='docs')a=a.filter(x=>x.type==='doc');if(S.view==='photos')a=a.filter(x=>x.type==='photo');if(S.view==='links')a=a.filter(x=>x.type==='link');if(S.view==='favs')a=a.filter(x=>x.favorite);if(S.view==='trash')a=S.items.filter(x=>x.trashed);if(S.view==='folder')a=a.filter(x=>S.folderId==='__unfiled'?!x.folderId:x.folderId===S.folderId);if(S.query.trim())a=a.filter(x=>searchMatch(x,S.query));return [...a].sort((a,b)=>S.sort==='az'?String(a.title||'').localeCompare(String(b.title||''),'ko'):(b.updatedAt||'').localeCompare(a.updatedAt||''))}
function folderOptions(current=null){return `<option value="">분류 없음</option>`+S.folders.map(f=>`<option value="${esc(f.id)}" ${f.id===current?'selected':''}>${esc(folderLabel(f))}</option>`).join('')}
function folderLabel(f){const names=[f.name];let p=f.parentId,n=0;while(p&&n++<10){const x=S.folders.find(y=>y.id===p);if(!x)break;names.unshift(x.name);p=x.parentId}return names.join(' / ')}
const views={home:['홈','대시보드'],docs:['모든 문서','문서'],photos:['이미지 컬렉션','이미지'],links:['링크 아카이브','북마크'],favs:['즐겨찾기','즐겨찾기'],trash:['휴지통','휴지통'],settings:['설정 · 백업','설정'],search:['전체 검색','검색'],folder:['폴더','폴더']};

function folderTree(parent=null,depth=0){return S.folders.filter(f=>(f.parentId||null)===parent).sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(f=>`<div class="folder-item" style="padding-left:${depth*11}px"><button class="nav-item ${S.view==='folder'&&S.folderId===f.id?'active':''}" data-folder="${f.id}" title="${esc(folderLabel(f))}">${icon('folder')}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${esc(f.name)}</span><span class="count">${S.items.filter(x=>!x.trashed&&x.folderId===f.id).length||''}</span></button><button class="more" data-folder-more="${f.id}" aria-label="폴더 설정">${icon('ellipsis')}</button></div>${folderTree(f.id,depth+1)}`).join('')}
function shell(){const alive=S.items.filter(isAlive);return `<div class="mobile-shade ${S.mobile?'show':''}" id="shade"></div><div class="app"><aside class="sidebar ${S.mobile?'open':''}"><div class="brand" data-nav="home"><div class="brand-mark">s<span>.</span></div><div class="brand-copy"><div class="brand-name">서랍<span class="brand-name-dot">.</span></div><div class="brand-sub">YOUR OWN ARCHIVE</div></div></div><button class="add-primary" id="quick-add">${icon('plus')} <span>새로운 기록</span><span class="add-arrow">↗</span></button><div class="nav-label">LIBRARY</div><nav class="nav-list">${navButton('home','홈','home')}${navButton('docs','모든 문서','file',alive.filter(x=>x.type==='doc').length)}${navButton('photos','이미지 컬렉션','image',alive.filter(x=>x.type==='photo').length)}${navButton('links','링크 아카이브','link',alive.filter(x=>x.type==='link').length)}</nav><div class="nav-label" style="display:flex;justify-content:space-between;align-items:center;margin-top:19px">MY FOLDERS<button aria-label="폴더 추가" id="add-folder" class="icon-button folder-plus" style="width:26px;height:26px">${icon('plus')}</button></div><div class="folder-list"><button class="nav-item ${S.view==='folder'&&S.folderId==='__unfiled'?'active':''}" data-folder="__unfiled">${icon('file')}<span>미분류</span><span class="count">${alive.filter(x=>!x.folderId).length||''}</span></button>${folderTree()||'<div class="folder-empty">+ 폴더를 만들어 정리해보세요</div>'}</div><div class="nav-divider"></div><nav class="nav-list nav-secondary">${navButton('favs','즐겨찾기','star')}${navButton('trash','휴지통','trash')}</nav><div class="side-bottom">${navButton('settings','설정 및 백업','settings')}<button class="logout-button" id="logout-side">${icon('shield')} 로그아웃 · 서랍 잠그기</button><div class="storage-note"><div class="storage-note-top"><span class="local-dot"></span><strong>PRIVATE & LOCAL</strong></div><div>모든 자료는 이 브라우저에만<br>저장돼요. 정기적인 백업을 권장해요.</div></div><div class="side-signature">SEORAP <span>© PERSONAL SPACE</span></div></div></aside>< function itemRow(x){const ty={doc:'file',photo:'image',link:'link'}[x.type];let preview=x.type==='doc'?x.content?.replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').slice(0,80):x.type==='photo'?`${formatBytes(x.size||0)} · ${x.notes||''}`:x.url;return `<div class="row-item clickable" data-open="${x.id}"><div class="row-icon ${x.type}">${icon(ty)}</div><div class="row-main"><div class="row-name">${esc(x.title||'제목 없음')}</div><div class="row-meta">${esc(preview||'내용 없음')} · ${fmt(x.updatedAt)}</div></div>${x.trashed?`<button class="item-action" data-restore="${x.id}" title="복원">${icon('back')}</button><button class="item-action" data-erase="${x.id}" title="영구 삭제">${icon('trash')}</button>`:`<button class="item-action ${x.favorite?'fav-on':''}" data-star="${x.id}" title="즐겨찾기">${icon('star')}</button><button class="item-action" data-more="${x.id}" title="자료 더보기">${icon('ellipsis')}</button>`}</div>`}

function docsOrFolder(){const data=visibleItems();const name=S.view==='folder'?(S.folderId==='__unfiled'?'미분류':S.folders.find(f=>f.id===S.folderId)?.name||'폴더'):views[S.view]?.[0]||'자료';const desc=S.view==='folder'?'이 폴더에 모아둔 자료':S.view==='trash'?'삭제한 자료를 복원하거나 완전히 삭제할 수 있어요':S.view==='favs'?'소중한 자료만 모아보기':'모아둔 기록을 한눈에 살펴보세요';const add=S.view==='trash'?'':`<button class="button primary sm" id="add-items">${icon('plus')} 새 자료</button>`;const filter=S.view==='trash'?'':`<div class="filterbar"><button class="chip ${S.sort==='recent'?'active':''}" data-sort="recent">최근 수정순</button><button class="chip ${S.sort==='az'?'active':''}" data-sort="az">이름순</button><select class="select" id="typefilter" aria-label="종류별 보기"><option value="all">모든 종류</option><option value="doc">문서만</option><option value="photo">사진만</option><option value="link">링크만</option></select></div>`;return title(name,desc,add)+filter+`<div class="panel" id="item-list">${data.length?data.map(itemRow).join(''):empty('저장한 자료가 없어요','새 글이나 링크, 사진을 추가해 보세요.',S.view==='trash'?'':`<button class="button primary sm" id="empty-add">자료 추가하기</button>`)}</div>${S.view==='trash'&&data.length?`<div style="margin-top:15px;text-align:right"><button class="button danger sm" id="empty-trash">휴지통 모두 비우기</button></div>`:''}`}
function photoPage(){const photos=visibleItems().filter(x=>x.type==='photo');return title('사진 보관함','영감이 되는 이미지를 모아서 보고, 원본 그대로 보관하세요.',`<button class="button primary sm" data-create="photo">${icon('upload')} 사진 업로드</button>`,'VISUAL LIBRARY')+`<div class="dropzone" id="photo-drop"><div style="font-size:23px;margin-bottom:5px">▧</div><strong>사진을 이곳에 끌어다 놓으세요</strong><small>또는 위의 사진 업로드 클릭 · JPG, PNG, WEBP, GIF</small></div><div class="gallery">${photos.map(x=>`<button class="photo-card" data-open="${x.id}"><div class="photo-thumb"><img class="lazy-photo" data-photo-id="${x.id}" alt="${esc(x.title)}"></div><div class="photo-caption"><strong>${esc(x.title)}</strong><small>${fmt(x.createdAt)} · ${formatBytes(x.size||0)}</small></div></button>`).join('')}</div>${!photos.length?empty('사진이 아직 없어요','이미지를 올리면 이곳에 모여요',''):''}`}
function linkPage(){const links=visibleItems().filter(x=>x.type==='link');return title('링크 보관함','언제든 다시 찾아보고 싶은 웹사이트와 참고 자료를 모아두세요.',`<button class="button primary sm" data-create="link">${icon('plus')} 링크 추가</button>`,'SAVED REFERENCES')+`<div class="panel">${links.length?links.map(x=>`<div class="link-card"><div class="link-badge">↗</div><div class="row-main"><div class="row-name">${esc(x.title)}</div><div class="row-meta">${esc(x.url)}</div>${x.description?`<div style="font-size:12px;color:#849389;margin-top:4px">${esc(x.description)}</div>`:''}${(x.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><button class="item-action ${x.favorite?'fav-on':''}" data-star="${x.id}" title="즐겨찾기">${icon('star')}</button><button class="item-action" data-open="${x.id}" title="수정">${icon('ellipsis')}</button><a class="icon-button" title="링크 열기" target="_blank" rel="noopener noreferrer" href="${esc(x.url)}">${icon('external')}</a></div>`).join(''):empty('아직 저장한 링크가 없어요','블로그, 영상, 영감 사이트를 저장해 보세요.','')}</div>`}
function searchPage(){return title('내 서랍 검색','제목 · 글 본문 · 태그 · 사진 이름 · 저장한 링크까지 한번에 찾을 수 있어요.','','FIND EVERYTHING')+`<div class="searchbar searchbar-strong">${icon('search')}<input id="search-input" placeholder="예: 여행 계획, 카페 사진, 마케팅 자료..." value="${esc(S.query)}" autocomplete="off" autofocus><span class="kbd">Ctrl K</span></div><div class="search-helper">${icon('shield')} 입력한 검색어는 이 브라우저에서만 처리돼요. 여러 단어도 함께 검색할 수 있어요.</div><div class="panel" id="search-results">${searchResults()}</div>`}
function searchResults(){if(!S.query.trim())return empty('어떤 기록을 찾고 있나요?','단어를 입력하면 문서·사진·링크를 한꺼번에 찾아요.','');const a=visibleItems();return `<div class="search-result-count">검색 결과 <strong>${a.length}개</strong></div>`+(a.length?a.map(x=>{const text=x.type==='doc'?plainDoc(x):x.type==='photo'?x.notes||'사진':x.description||x.url||'';const q=S.query.trim().split(/\s+/)[0].toLocaleLowerCase('ko');const idx=text.toLocaleLowerCase('ko').indexOf(q);const excerpt=idx>=0?text.slice(Math.max(0,idx-48),idx+145):text.slice(0,145);return `<div class="search-result-item">${itemRow(x)}${excerpt?`<div class="search-excerpt">${esc(excerpt)}</div>`:''}</div>`}).join(''):empty('검색 결과가 없어요','검색어를 줄이거나 다른 단어로 찾아보세요.',''))}
function settingsPage(){return title('설정 · 백업','이 보관함의 기록은 현재 사용 중인 브라우저에만 저장돼요.','', 'YOUR DATA, YOUR CONTROL')+`<div class="setting-grid"><div class="setting-card"><div class="page-eyebrow">01 · BACKUP</div><h3 style="margin-top:8px">ZIP으로 전체 백업</h3><p>모든 문서, 폴더, 링크, 원본 사진을 하나의 파일로 내려받아요. 다른 기기로 옮기거나 보관할 때 사용하세요.</p><div class="buttons"><button class="button primary sm" id="export-zip">${icon('download')} ZIP 백업 다운로드</button></div><p>마지막 백업: <strong>${S.lastBackup?fmt(S.lastBackup):'아직 없음'}</strong></p></div><div class="setting-card"><div class="page-eyebrow">02 · RESTORE</div><h3 style="margin-top:8px">백업 파일 복원</h3><p>내보낸 ZIP 파일을 불러와 자료를 복원할 수 있어요. <strong>기존 자료를 전부 교체</strong>하므로 먼저 백업해 두세요.</p><div class="buttons"><button class="button sm" id="import-zip">${icon('upload')} ZIP 파일 불러오기</button></div></div><div class="setting-card"><div class="page-eyebrow">03 · STORAGE</div><h3 style="margin-top:8px">브라우저 저장공간</h3><p id="storage-estimate">기기 저장공간 정보를 확인하는 중...</p><p>사진은 압축하지 않은 원본으로 보관해요. 브라우저가 허용하는 용량을 넘으면 저장이 실패할 수 있어요.</p><div class="buttons"><button class="button sm" id="refresh-storage">${icon('clock')} 사용량 확인</button></div></div><div class="setting-card"><div class="page-eyebrow">04 · IMPORTANT</div><h3 style="margin-top:8px">꼭 알아두세요</h3><p>같은 사이트여도 PC, 휴대폰, 다른 브라우저는 별개 보관함이에요. 시크릿 모드 사용, 사이트 데이터 삭제, 브라우저 프로필 삭제 시 자료가 사라질 수 있어요.</p><div class="warning">자료를 오래 보관하려면 주기적으로 ZIP 백업을 저장하세요.</div><div class="setting-card"><div class="page-eyebrow">05 · ACCESS</div><h3 style="margin-top:8px">내 서랍 잠금</h3><p>아이디 <strong>${esc(S.authRecord?.username||'')}</strong> · 이 기기에서만 사용하는 로그인입니다. 비밀번호는 해시값으로 보관하지만, 글·사진·링크 데이터 자체는 암호화되지 않아요.</p><div class="buttons"><button class="button sm" id="change-password">비밀번호 변경</button><button class="button sm" id="logout-settings">로그아웃</button></div></div></div>`}
function editorPage(){const item=S.items.find(x=>x.id===S.docId&&x.type==='doc');if(!item){S.view='docs';return docsOrFolder()}return `<div class="edit-shell"><div class="edit-top"><button class="small-btn" data-nav="docs">${icon('back')} 목록으로</button><span id="save-indicator" style="color:#95a49a;font-size:12px">저장됨</span><div style="display:flex;gap:3px"><button class="icon-button ${item.favorite?'fav-on':''}" data-star="${item.id}" title="즐겨찾기">${icon('star')}</button><button class="icon-button" data-more="${item.id}" title="추가 메뉴">${icon('ellipsis')}</button></div></div><input class="editor-title" id="doc-title" value="${esc(item.title)}" placeholder="제목 없음" aria-label="문서 제목"><div class="editor-meta"><span>생성 ${fmt(item.createdAt)}</span><span>·</span><label>폴더 <select class="select" id="doc-folder">${folderOptions(item.folderId)}</select></label><label>태그 <input id="doc-tags" placeholder="쉼표로 구분" value="${esc((item.tags||[]).join(', '))}"></label></div><div class="toolbar" role="toolbar" aria-label="서식"><button class="tool" data-format="bold" title="굵게"><b>B</b></button><button class="tool" data-format="italic" title="기울임"><i>I</i></button><button class="tool" data-format="underline" title="밑줄"><u>U</u></button><span class="tool sep"></span><button class="tool" data-block="h1">H1</button><button class="tool" data-block="h2">H2</button><button class="tool" data-block="p">본문</button><span class="tool sep"></span><button class="tool" data-format="insertUnorderedList" title="글머리 목록">☷</button><button class="tool" data-format="insertOrderedList" title="번호 목록">1.</button><button class="tool" data-block="blockquote" title="인용">❝</button><span class="tool sep"></span><button class="tool" data-format="insertHorizontalRule" title="구분선">―</button><button class="tool" id="insert-link" title="링크 삽입">${icon('link')}</button><button class="tool tool-insert-image" id="insert-photo" title="현재 커서 위치에 사진 넣기">${icon('image')} 사진 넣기</button><button class="tool" data-format="undo" title="되돌리기">↶</button><button class="tool" data-format="redo" title="다시 실행">↷</button></div><div class="editor-hint"><div>${icon('image')} <b>사진과 글을 함께 기록하세요.</b> 커서 위치에서 사진 넣기 · 사진 복사/붙여넣기 · 파일 끌어다 놓기</div><button id="suggest-folder" type="button">${icon('folder')} 폴더 추천</button></div><div class="editor-drop-hint" id="editor-drop-hint">여기에 사진을 놓으면 글 안에 삽입돼요</div><div class="editor-body" contenteditable="true" id="doc-body" role="textbox" aria-multiline="true" aria-label="문서 내용">${sanitize(item.content||'')}</div><div style="margin-top:20px;color:#9eaaa0;font-size:11px">${icon('shield')} 이 문서는 이 기기 브라우저에 자동 저장됩니다.</div></div>`}
function page(){if(S.view==='home')return home();if(S.view==='doc')return editorPage();if(S.view==='photos')return photoPage();if(S.view==='links')return linkPage();if(S.view==='settings')return settingsPage();if(S.view==='search')return searchPage();return docsOrFolder()}
function sanitize(html){const node=document.createElement('template');node.innerHTML=String(html||'');const allowed=new Set(['P','DIV','BR','SPAN','B','STRONG','I','EM','U','S','H1','H2','H3','UL','OL','LI','BLOCKQUOTE','HR','A','IMG']);function scrub(parent){for(const el of [...parent.children]){if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','SVG','FORM','VIDEO','AUDIO','INPUT','BUTTON'].includes(el.tagName)){el.remove();continue}if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);continue}for(const at of [...el.attributes]){const ok=(el.tagName==='A'&&at.name==='href')||(el.tagName==='IMG'&&at.name==='data-asset-id')||((el.tagName==='SPAN'||el.tagName==='DIV')&&at.name==='style');if(!ok)el.removeAttribute(at.name)}if(el.tagName==='A'){const href=el.getAttribute('href');if(!/^https?:\/\//i.test(href||''))el.removeAttribute('href');else{el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer')}}if(el.tagName==='IMG'){const aid=el.getAttribute('data-asset-id');if(!aid||!/^[-a-zA-Z0-9_]{5,80}$/.test(aid)){el.remove();continue}}scrub(el)}}scrub(node.content);return node.innerHTML}
function editorHtml(){const body=$('#doc-body');if(!body)return '';const clone=body.cloneNode(true);clone.querySelectorAll('img').forEach(img=>{img.removeAttribute('src');img.removeAttribute('style');});return sanitize(clone.innerHTML)}
async function hydrateImages(context=document){for(const img of context.querySelectorAll('img[data-asset-id]')){const item=S.items.find(x=>x.id===img.dataset.assetId&&x.type==='photo');if(item){img.src=await photoUrl(item);img.alt=item.title||'문서 이미지'}else{img.alt='원본을 찾을 수 없는 사진'}}for(const img of context.querySelectorAll('.lazy-photo')){const item=S.items.find(x=>x.id===img.dataset.photoId);if(item)img.src=await photoUrl(item)}}
function render(){if(!S.authenticated){renderAuth();return}const prior=$('#search-input')===document.activeElement;const oldPos=prior?$('#search-input')?.selectionStart:0;$('#root').innerHTML=shell();bind();hydrateImages($('#root'));if(S.view==='search'&&prior){$('#search-input')?.focus();$('#search-input')?.setSelectionRange(oldPos,oldPos)}else if(S.view==='search')$('#search-input')?.focus();if(S.view==='settings')storageEstimate()}
async function navigate(v,folder){if(!S.authenticated){renderAuth();return}await flushEditor();S.view=v;S.folderId=folder??null;S.docId=null;S.mobile=false;if(v!=='search')S.query='';render();window.scrollTo(0,0)}
function dialog(html,wide=false){$('#modal-root').innerHTML=`<div class="dialog-backdrop"><div class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;$('#modal-root .dialog-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('dialog-backdrop'))closeDialog()});$('#modal-root input:not([type="hidden"]),#modal-root textarea')?.focus()}
function closeDialog(){$('#modal-root').innerHTML=''}
function addDialog(){dialog(`<h2>새 자료 추가</h2><p class="sub">어떤 자료를 보관할까요?</p><div class="quick-grid" style="grid-template-columns:1fr;gap:9px"><button class="quick-card" data-create="doc"><span class="quick-icon">${icon('file')}</span><span><strong>문서 작성</strong><small>생각, 메모, 긴 글 저장</small></span></button><button class="quick-card" data-create="photo"><span class="quick-icon">${icon('image')}</span><span><strong>사진 업로드</strong><small>원본 사진을 그대로 저장</small></span></button><button class="quick-card" data-create="link"><span class="quick-icon">${icon('link')}</span><span><strong>사이트 링크</strong><small>즐겨 찾는 페이지 보관</small></span></button></div><div class="dialog-actions"><button class="button sm" data-close>닫기</button></div>`);bindModal()}
async function newDoc(){closeDialog();const item={id:id(),type:'doc',title:'제목 없음',content:'',tags:[],folderId:S.view==='folder'&&S.folderId!=='__unfiled'?S.folderId:null,favorite:false,trashed:false,createdAt:now(),updatedAt:now()};await saveItem(item,true);S.view='doc';S.docId=item.id;S.mobile=false;render();$('#doc-title')?.focus()}
function parseTags(s){return [...new Set(String(s||'').split(',').map(x=>x.trim()).filter(Boolean))].slice(0,20)}
function linkDialog(item=null){dialog(`<h2>${item?'링크 수정':'새 링크 저장'}</h2><p class="sub">다시 보고 싶은 사이트를 추가해 주세요.</p><form id="link-form"><div class="field"><label for="link-url">웹사이트 주소</label><input id="link-url" required placeholder="https://example.com" value="${esc(item?.url||'')}"></div><div class="field"><label for="link-title">제목</label><input id="link-title" placeholder="제목을 입력해 주세요" value="${esc(item?.title||'')}"></div><div class="field"><label for="link-desc">간단한 메모</label><textarea id="link-desc" placeholder="어떤 점이 좋았나요?">${esc(item?.description||'')}</textarea></div><div class="field"><label for="link-tags">태그 (쉼표로 구분)</label><input id="link-tags" placeholder="예: 레퍼런스, 공부" value="${esc((item?.tags||[]).join(', '))}"></div><div class="field"><label for="link-folder">폴더</label><select id="link-folder">${folderOptions(item?.folderId??(S.view==='folder'?S.folderId:null))}</select></div><div class="dialog-actions"><button class="button sm" type="button" data-close>취소</button><button class="button primary sm" type="submit">${item?'수정 완료':'링크 저장'}</button></div></form>`);bindModal();$('#link-form').addEventListener('submit',async e=>{e.preventDefault();let u=$('#link-url').value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;try{const p=new URL(u);if(!['http:','https:'].includes(p.protocol))throw Error();const x=item||{id:id(),type:'link',createdAt:now(),favorite:false,trashed:false};x.url=u;x.title=$('#link-title').value.trim()||p.hostname;x.description=$('#link-desc').value.trim();x.tags=parseTags($('#link-tags').value);x.folderId=$('#link-folder').value||null;await saveItem(x,true);closeDialog();if(S.view==='home'||S.view==='links'||S.view==='folder')render();else await navigate('links');toast('링크가 저장됐어요')}catch(err){toast('올바른 웹사이트 주소를 입력해 주세요',true)}})}
function folderDialog(existing=null){dialog(`<h2>${existing?'폴더 수정':'새 폴더 만들기'}</h2><p class="sub">자료를 보기 좋게 분류해 보세요.</p><form id="folder-form"><div class="field"><label for="folder-name">폴더 이름</label><input id="folder-name" required maxlength="70" placeholder="예: 인스타그램 레퍼런스" value="${esc(existing?.name||'')}"></div><div class="field"><label for="folder-parent">상위 폴더</label><select id="folder-parent"><option value="">최상위</option>${S.folders.filter(f=>f.id!==existing?.id&&!isDescendant(f.id,existing?.id)).map(f=>`<option value="${f.id}" ${existing?.parentId===f.id?'selected':''}>${esc(folderLabel(f))}</option>`).join('')}</select></div><div class="dialog-actions"><button class="button sm" type="button" data-close>취소</button><button class="button primary sm" type="submit">저장</button></div></form>`);bindModal();$('#folder-form').addEventListener('submit',async e=>{e.preventDefault();const name=$('#folder-name').value.trim();if(!name)return;const x=existing||{id:id(),createdAt:now()};x.name=name;x.parentId=$('#folder-parent').value||null;await saveFolder(x);closeDialog();render();toast('폴더가 저장됐어요')})}

async function readZip(blob){const arr=new Uint8Array(await blob.arrayBuffer());const d=new DataView(arr.buffer);const files=new Map();let off=0;while(off+30<=arr.length&&d.getUint32(off,true)===0x04034b50){const method=d.getUint16(off+8,true),flags=d.getUint16(off+6,true),size=d.getUint32(off+18,true),namelen=d.getUint16(off+26,true),extra=d.getUint16(off+28,true);if(method!==0||(flags&8))throw Error('이 백업 ZIP 형식은 지원하지 않아요');const start=off+30+namelen+extra;if(start+size>arr.length)throw Error('백업 파일이 손상되었어요');const name=td.decode(arr.slice(off+30,off+30+namelen));const body=arr.slice(start,start+size);if(crc32(body)!==d.getUint32(off+14,true))throw Error('백업 파일 검사에 실패했어요');files.set(name,new Blob([body]));off=start+size;if(files.size>100000)throw Error('백업 항목이 너무 많아요')}return files}
async function exportBackup(){const btn=$('#export-zip');if(btn){btn.disabled=true;btn.textContent='ZIP 생성 중...'}try{await flushEditor();const data=S.items.map(({blob,...rest})=>({...rest}));const manifest={format:'seorap-browser-v1',exportedAt:now(),folders:S.folders,items:data};const files=[{name:'archive.json',blob:new Blob([JSON.stringify(manifest)],{type:'application/json'})}];for(const x of S.items)if(x.type==='photo'&&x.blob instanceof Blob)files.push({name:`photos/${x.id}`,blob:x.blob});const zip=await makeZip(files);downloadBlob(zip,`seorap-backup-${new Date().toISOString().slice(0,10)}.zip`);S.lastBackup=now();await request('meta','put',{key:'backupAt',value:S.lastBackup});toast('모든 자료를 ZIP으로 백업했어요');render()}catch(e){console.error(e);toast('ZIP 백업에 실패했어요: '+e.message,true)}finally{if(btn){btn.disabled=false;btn.textContent='ZIP 백업 다운로드'}}}
async function importBackup(file){if(!file)return;try{const files=await readZip(file);const mf=files.get('archive.json');if(!mf)throw Error('서랍 백업 파일이 아니에요');const manifest=JSON.parse(await mf.text());if(manifest.format!=='seorap-browser-v1'||!Array.isArray(manifest.items)||!Array.isArray(manifest.folders))throw Error('지원하지 않는 백업 버전이에요');for(const x of manifest.items){if(!x.id||!['doc','photo','link'].includes(x.type))throw Error('자료 형식이 올바르지 않아요');if(x.type==='photo'&&!files.has(`photos/${x.id}`))throw Error(`사진 원본이 빠졌어요: ${x.title}`)}if(!confirm(`백업 자료 ${manifest.items.length}개, 폴더 ${manifest.folders.length}개를 복원할까요? 현재 저장된 모든 자료가 삭제되고 이 백업으로 대체됩니다.`))return;for(const x of manifest.items){if(x.type==='photo'){const b=files.get(`photos/${x.id}`);x.blob=new Blob([await b.arrayBuffer()],{type:x.mime||'application/octet-stream'})}else if(x.type==='doc')x.content=sanitize(x.content||'')}const tx=db.transaction(['items','folders','meta'],'readwrite');const its=tx.objectStore('items'),fld=tx.objectStore('folders'),met=tx.objectStore('meta');its.clear();fld.clear();for(const f of manifest.folders)fld.put({id:String(f.id),name:String(f.name||'폴더'),parentId:f.parentId||null,createdAt:f.createdAt||now()});for(const x of manifest.items)its.put(x);met.put({key:'backupAt',value:now()});await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});for(const u of S.cache.values())URL.revokeObjectURL(u);S.cache.clear();await load();S.view='home';S.docId=null;S.query='';render();toast('백업을 성공적으로 복원했어요')}catch(e){console.error(e);toast('복원 실패: '+e.message,true)}finally{$('#import-file').value=''}}
async function inlineImage(files){await addImagesInDocument(files)}
$('#global-files').addEventListener('change',e=>uploadPhotos(e.target.files));$('#inline-image').addEventListener('change',e=>inlineImage(e.target.files));$('#import-file').addEventListener('change',e=>importBackup(e.target.files[0]));
document.addEventListener('keydown',e=>{if(!S.authenticated)return;if(e.key==='Escape'){closeDialog();if(S.view==='search')navigate('home')}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();navigate('search')}});
async function boot(){
 if(!('indexedDB'in window))throw Error('이 브라우저는 로컬 저장을 지원하지 않아요');
 db=await openDB();
 S.authRecord=await request('meta','get',AUTH_KEY)||null;
 S.authMode=S.authRecord?'login':'create';
 if(S.authRecord&&hasRememberedLogin(S.authRecord)){
  S.authenticated=true;
  try{await initializeVault();render();return}catch(error){
   S.authenticated=false;
   clearRememberedLogin();
   console.error('Automatic login could not load the archive:',error);
  }
 }
 renderAuth();
}
boot().catch(err=>{$('#root').innerHTML=`<div style="max-width:550px;margin:100px auto;padding:25px"><h2>보관함을 열 수 없어요</h2><p>${esc(err?.message||'브라우저 저장소 접근에 실패했어요')}</p><p>시크릿 모드나 저장공간 설정을 확인하고 새로고침해 주세요.</p></div>`;console.error(err)});
})();
</script>
